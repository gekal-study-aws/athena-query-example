services:
  floci:
    image: floci/floci:latest
    container_name: floci
    user: root
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.floci-data:/app/data
    networks:
      - app-network

  backend:
    image: gekal/aws-athena-api-demo:0.0.1-SNAPSHOT
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aws-athena-api-demo-backend
    depends_on:
      - floci
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m --enable-preview"
      CORS_ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:3000,http://localhost"
      AWS_ENDPOINT_URL: "http://floci:4566"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
    container_name: aws-athena-api-demo-frontend
    ports:
      - "3001:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
