services:
  floci-duck-init:
    image: alpine:3.20
    container_name: floci-duck-init
    entrypoint: ["/bin/sh", "/init/floci-duck-init.sh"]
    environment:
      DUCKDB_VERSION: v1.5.2
    volumes:
      - floci-duck-ext:/ext
      - ./infra-sdk/scripts:/init:ro
    networks:
      - app-network

  floci-duck:
    image: floci/floci-duck:0.1.5
    container_name: floci-duck
    depends_on:
      floci-duck-init:
        condition: service_completed_successfully
    environment:
      FLOCI_DUCK_S3_ACCESS_KEY: test
      FLOCI_DUCK_S3_SECRET_KEY: test
      FLOCI_DUCK_S3_REGION: ap-northeast-1
      FLOCI_DUCK_EXT_DIR: /ext
    volumes:
      - floci-duck-ext:/ext
    networks:
      - app-network

  floci:
    image: floci/floci:1.5.12
    container_name: floci
    user: root
    depends_on:
      - floci-duck
    ports:
      - "4566:4566"
    environment:
      FLOCI_SERVICES_ATHENA_DUCK_URL: http://floci-duck:3000
      FLOCI_HOSTNAME: floci
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.floci-data:/app/data
    networks:
      - app-network

  backend:
    image: gekal/aws-athena-api-demo:0.0.1-SNAPSHOT
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aws-athena-api-demo-backend
    depends_on:
      - floci
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m --enable-preview"
      CORS_ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:3000,http://localhost"
      AWS_ENDPOINT_URL: "http://floci:4566"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
    container_name: aws-athena-api-demo-frontend
    ports:
      - "3001:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  floci-duck-ext:
